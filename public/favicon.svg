  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#brandGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Modern Geometric Monogram J -->
  <!-- Top Horizontal Bar -->
