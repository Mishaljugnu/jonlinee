      <stop offset="0%" stop-color="#5121A8" />
      <stop offset="100%" stop-color="#2D1160" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F47721" />
      <stop offset="100%" stop-color="#D95A0B" />
    </linearGradient>
